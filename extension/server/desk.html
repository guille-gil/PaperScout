<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Scout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 170'%3E%3Cpath d='M20 10 H100 L130 40 V150 Q130 160 120 160 H20 Q10 160 10 150 V20 Q10 10 20 10 Z' fill='%23FCFAF5' stroke='%231F2A44' stroke-width='12' stroke-linejoin='round'/%3E%3Cpath d='M32 132 C 52 110, 40 92, 62 82' fill='none' stroke='%232F4B8C' stroke-width='12' stroke-linecap='round'/%3E%3Ccircle cx='98' cy='56' r='20' fill='%23F2D65C' stroke='%231F2A44' stroke-width='8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Paper Scout identity: a field notebook. Warm paper, ink-blue, one highlighter for what needs you. */
:root {
  --paper: #F7F3EA; --leaf: #FCFAF5; --rule: #E4DDCC; --rule-soft: #EEE8DB;
  --ink: #1F2A44; --ink-2: #4A5268; --faint: #8A8E98;
  --accent: #2F4B8C; --accent-soft: #E3E8F3;
  --mark: #F2D65C; --mark-soft: #FBF0BF;
  --good: #3F7D5A; --good-soft: #E1EEE5; --warn: #A87522; --warn-soft: #F6EAD2; --bad: #B4493E; --bad-soft: #F5E1DD;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #171B24; --leaf: #1D222D; --rule: #2E3544; --rule-soft: #262C38;
    --ink: #E9E3D6; --ink-2: #B7B3AA; --faint: #7E8290;
    --accent: #9DB2E6; --accent-soft: #283452;
    --mark: #D9BE55; --mark-soft: #3B3522;
    --good: #7CBF95; --good-soft: #213428; --warn: #D7A854; --warn-soft: #3A3021; --bad: #E08B80; --bad-soft: #3D2426;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #171B24; --leaf: #1D222D; --rule: #2E3544; --rule-soft: #262C38;
  --ink: #E9E3D6; --ink-2: #B7B3AA; --faint: #7E8290;
  --accent: #9DB2E6; --accent-soft: #283452;
  --mark: #D9BE55; --mark-soft: #3B3522;
  --good: #7CBF95; --good-soft: #213428; --warn: #D7A854; --warn-soft: #3A3021; --bad: #E08B80; --bad-soft: #3D2426;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); padding: 0 16px 56px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 720px; margin: 0 auto; }
.wrap.wide { max-width: 1040px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Header */
header { position: sticky; top: 0; z-index: 5; background: var(--paper); padding-top: 18px; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font: 500 36px/1 var(--serif); letter-spacing: -0.015em; margin-right: auto; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 12px; }
.brand i { color: var(--accent); font-style: italic; }
.logo { display: inline-block; height: var(--cap, 0.68em); }
.logo svg { height: var(--cap, 0.68em); width: auto; display: block; overflow: visible; }
.controls { display: inline-flex; align-items: center; gap: 10px; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--faint); }
select { background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 4px 2px; max-width: 200px; cursor: pointer; color: var(--ink-2); }
.icon { background: none; border: 0; padding: 6px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border-radius: 6px; }
.icon:hover { color: var(--ink); background: var(--rule-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.icon.on .dot { background: var(--good); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .icon.on .dot { animation: none; } }
.projline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.ptitle { font: 500 17px/1.3 var(--sans); color: var(--ink); }
.pen { background: none; border: 0; padding: 2px 4px; cursor: pointer; color: var(--faint); border-radius: 4px; line-height: 1; }
.pen:hover { color: var(--accent); background: var(--rule-soft); }
.pen svg { width: 13px; height: 13px; vertical-align: -1px; }
.ptitle-in { font: 500 17px/1.3 var(--sans); border: 0; border-bottom: 1px solid var(--accent); background: transparent; padding: 0 2px; min-width: 240px; }
.updated { font-size: 12.5px; color: var(--faint); }
nav { display: flex; gap: 24px; border-bottom: 1px solid var(--rule); margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 0 9px; cursor: pointer; color: var(--faint); font-weight: 500; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.ms-title { font: 500 24px/1.25 var(--serif); margin: 6px 0 4px; max-width: 34ch; }
.ms-stats { color: var(--ink-2); font-size: 13.5px; margin: 0 0 14px; }
.ms-path { flex: 1 1 280px; background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 5px 2px; font: 13.5px var(--mono); color: var(--ink); min-width: 0; }
.ms-path:focus { outline: none; border-bottom-color: var(--accent); }
.ms-outline { display: grid; gap: 2px; }
.ms-row { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; font-size: 14px; }
.ms-t { flex: 0 1 auto; }
.ms-m { color: var(--faint); font-size: 12.5px; flex: 1 1 auto; }
.ms-src { padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--rule-soft); }
.ms-ask { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; }
.ms-ask code { font: 13px var(--mono); }
.ms-gone { margin-top: 10px; }
.ms-gone > summary { cursor: pointer; color: var(--ink-2); font-size: 13px; padding: 4px 0; }
.badge { font: 600 11px/1 var(--sans); background: var(--mark); color: #2A2410; border-radius: 999px; padding: 3px 6px; }
main { padding-top: 22px; }
.lede { font: italic 400 15px/1.45 var(--serif); color: var(--ink-2); margin: 0 0 18px; }
.notice { border-left: 3px solid var(--warn); background: var(--leaf); padding: 10px 12px; font-size: 14px; margin: 12px 0; border-radius: 0 6px 6px 0; }
.notice.err { border-left-color: var(--bad); }
.notice .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { background: var(--leaf); border: 1px solid var(--rule); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.subnav { display: flex; gap: 18px; margin: -6px 0 18px; font-size: 14px; }
.subnav button { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--faint); border-bottom: 1px solid transparent; }
.subnav button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* The idea */
.kicker { font: 600 11.5px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.kicker .v { color: var(--accent); }
.printlink { margin-left: auto; font: 500 12.5px var(--sans); letter-spacing: 0; text-transform: none; color: var(--accent); text-decoration: none; }
.statement { font: 400 27px/1.28 var(--serif); letter-spacing: -0.01em; margin: 10px 0 10px; text-wrap: pretty; }
.since { color: var(--ink-2); font-size: 14px; margin: 0 0 22px; }
.since b { font-weight: 500; color: var(--ink); }
.attention { background: var(--mark-soft); border-radius: 8px; padding: 9px 12px; margin: 0 0 20px; font-size: 14px; }
.attention summary { cursor: pointer; font-weight: 500; }
.attention ul { margin: 8px 0 2px; padding-left: 18px; color: var(--ink-2); }
details.sec { border-top: 1px solid var(--rule); }
details.sec:last-of-type { border-bottom: 1px solid var(--rule); }
details.sec > summary { list-style: none; cursor: pointer; padding: 14px 0; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: baseline; }
details.sec > summary::-webkit-details-marker { display: none; }
.chev { color: var(--faint); transition: transform .15s; display: inline-block; font-size: 11px; }
details[open] > summary .chev, .open > .chev { transform: rotate(90deg); }
.sec-title { font: 500 19px/1.2 var(--serif); }
.sec-sum { color: var(--faint); font-size: 13px; text-align: right; }
.sec-body { padding: 0 0 18px 26px; display: grid; gap: 14px; }
.field h4 { margin: 0 0 2px; font: 600 11px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.field p { margin: 0; max-width: 62ch; }
.missing { color: var(--faint); font-size: 13.5px; margin: 0; }
.claim { display: grid; gap: 6px; }
.claim-t { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; }
.meter { display: inline-flex; gap: 2px; align-items: center; }
.meter i { width: 6px; height: 14px; border-radius: 2px; display: inline-block; }
.meter .s { background: var(--good); } .meter .o { background: var(--bad); } .meter .q { background: var(--warn); } .meter .n { background: var(--rule); }
.ev { font-size: 13.5px; color: var(--ink-2); padding: 2px 0 2px 12px; border-left: 2px solid var(--rule); }
.ev[data-rel="supports"] { border-left-color: var(--good); } .ev[data-rel="opposes"] { border-left-color: var(--bad); } .ev[data-rel="qualifies"] { border-left-color: var(--warn); }
.ev .src { color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; color: var(--ink-2); background: var(--leaf); }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* Notes */
.composer { display: grid; gap: 8px; margin: 0 0 22px; }
.composer textarea { width: 100%; min-height: 44px; resize: vertical; background: var(--leaf); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; font: 15px/1.45 var(--serif); color: var(--ink); }
.composer textarea::placeholder, .quick input::placeholder { color: var(--faint); font-style: italic; }
.composer .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kinds { display: inline-flex; gap: 12px; font-size: 13px; flex-wrap: wrap; }
.kinds button { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--faint); border-bottom: 1px solid transparent; }
.kinds button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.notes { display: grid; gap: 8px; margin: -10px 0 22px; }
.note { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; font-size: 14px; padding: 8px 10px; background: var(--leaf); border-radius: 8px; border-left: 3px solid var(--rule); }
.note[data-kind="supervision"] { border-left-color: var(--accent); }
.note[data-kind="check"] { border-left-color: var(--mark); }
.note .nk { font-size: 11.5px; color: var(--faint); }

/* History timeline */
h2.h { font: 500 19px/1.2 var(--serif); margin: 34px 0 12px; }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 1px; background: var(--rule); }
.tl li { position: relative; padding: 0 0 16px 24px; }
.tl li::before { content: ""; position: absolute; left: 0; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2px solid var(--rule); }
.tl li.current::before { border-color: var(--accent); background: var(--accent); }
.tl li.branch::before { border-color: var(--warn); }
.tl .head { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.tl .vid { font: 600 13px var(--sans); color: var(--accent); }
.when { font-size: 12.5px; color: var(--faint); }
.tag { font-size: 11.5px; border-radius: 4px; padding: 1px 6px; background: var(--rule-soft); color: var(--ink-2); }
.tag.sup { background: var(--accent-soft); color: var(--accent); }
.tl .chg { margin-top: 2px; }
.tl .more { margin-top: 8px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.diff { font: 400 16px/1.45 var(--serif); color: var(--ink); }
.diff ins { background: var(--good-soft); text-decoration: none; border-radius: 3px; padding: 0 2px; }
.diff del { color: var(--faint); }

/* Lists */
.group { margin-top: 22px; }
.group > summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center; font: 600 11.5px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--faint); padding: 6px 0 8px; }
.group > summary::-webkit-details-marker { display: none; }
.items { border-top: 1px solid var(--rule); }
.item { border-bottom: 1px solid var(--rule); padding: 10px 0; display: grid; gap: 4px; }
.item .top { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; }
.item .top.nochev { grid-template-columns: 1fr auto; }
.item .name { font: 500 17px/1.3 var(--serif); cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item .name:hover { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.item .sub { color: var(--ink-2); font-size: 13.5px; max-width: 62ch; }
.item .meta { color: var(--faint); font-size: 12.5px; display: flex; gap: 4px 12px; flex-wrap: wrap; }
.item .indent { padding-left: 22px; display: grid; gap: 4px; }
.item.needs { box-shadow: inset 3px 0 0 var(--mark); padding-left: 12px; }
.item .body { padding: 8px 0 4px 22px; display: grid; gap: 12px; font-size: 14px; }
.choice { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; flex: none; }
.choice button { background: var(--leaf); border: 0; border-left: 1px solid var(--rule); padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.choice button:first-child { border-left: 0; }
.choice button[aria-pressed="true"][data-v="good"] { background: var(--good-soft); color: var(--good); font-weight: 600; }
.choice button[aria-pressed="true"][data-v="warn"] { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.choice button[aria-pressed="true"][data-v="bad"] { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.choice button:disabled { cursor: default; opacity: .5; }
.defs { display: grid; gap: 10px; }
.def { display: grid; grid-template-columns: 58px 1fr; gap: 10px; }
.def .yr { font: 500 13px var(--sans); color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
.def q { font: italic 400 15.5px/1.45 var(--serif); }
.def .who { font-size: 12.5px; color: var(--faint); }
.spark { display: inline-block; vertical-align: -2px; }
.spark rect { fill: var(--accent); opacity: .7; }
.bigspark { width: 100%; max-width: 440px; height: 70px; display: block; }
.bigspark rect { fill: var(--accent); opacity: .8; }
.bigspark text { fill: var(--faint); font: 10.5px var(--sans); }
.filters { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13.5px; }
.filters button { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--faint); border-bottom: 1px solid transparent; }
.filters button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.filters b { font-weight: 500; font-variant-numeric: tabular-nums; }
.searchrow { display: flex; gap: 8px; margin-bottom: 14px; }
.searchrow input, .mini input, .mini select, .quick input { flex: 1; min-width: 0; background: var(--leaf); border: 1px solid var(--rule); border-radius: 7px; padding: 7px 10px; }
.mini { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mini select { flex: 0 1 auto; padding: 5px 8px; font-size: 13.5px; }
.links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.links a { color: var(--accent); }
.card { font-size: 13.5px; padding-left: 12px; border-left: 2px solid var(--accent); }
.card .loc { color: var(--faint); font-size: 12px; }
.card q { display: block; font: italic 14px/1.4 var(--serif); color: var(--ink-2); }
pre.out { margin: 0; white-space: pre-wrap; font: 12px/1.45 var(--mono); background: var(--rule-soft); padding: 8px; border-radius: 6px; }
.verdict { font: 600 11px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 4px 7px; white-space: nowrap; }
.verdict.answered { background: var(--good-soft); color: var(--good); }
.verdict.partly, .verdict.contested { background: var(--warn-soft); color: var(--warn); }
.verdict.open, .verdict.none { background: var(--rule-soft); color: var(--ink-2); }
details.plain { margin-top: 18px; }
.shelf > details.plain { margin-top: 0; }
details.plain > summary { cursor: pointer; color: var(--ink-2); font-size: 14px; padding: 8px 0; }
.empty { color: var(--ink-2); padding: 12px 0; max-width: 56ch; margin: 0; }
.foot { margin-top: 36px; color: var(--faint); font-size: 12px; overflow-wrap: anywhere; }
table.cmp { border-collapse: collapse; font-size: 13px; width: 100%; }
.cmpwrap { overflow-x: auto; }
table.cmp th, table.cmp td { border-bottom: 1px solid var(--rule); padding: 5px 6px; text-align: center; vertical-align: bottom; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp th { font-weight: 500; color: var(--ink-2); font-size: 12px; }
table.cmp td.y::after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

/* Framework */
.fwbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.fwhint { font-size: 13px; color: var(--ink-2); min-height: 20px; margin: 0 0 8px; }
.canvas { background: var(--leaf); border: 1px solid var(--rule); border-radius: 10px; touch-action: none; user-select: none; }
.canvas svg { width: 100%; display: block; }
.fw-node rect { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.fw-node.cand rect { stroke-dasharray: 5 4; }
.fw-node.sel rect { stroke: var(--accent); stroke-width: 2.4; }
.fw-node.from rect { fill: var(--mark-soft); }
.fw-node text { fill: var(--ink); font: 13px var(--sans); pointer-events: none; }
.fw-node { cursor: grab; }
.fw-edge { cursor: pointer; }
.fw-edge .hit { stroke: transparent; stroke-width: 14; fill: none; }
.fw-edge .ln { fill: none; stroke-width: 1.6; }
.fw-edge.supported .ln { stroke: var(--ink); }
.fw-edge.unsupported .ln, .fw-edge.none .ln { stroke: var(--faint); stroke-dasharray: 6 5; }
.fw-edge.contested .ln { stroke: var(--bad); }
.fw-edge.proposed .ln { stroke: var(--accent); stroke-dasharray: 3 4; opacity: .8; }
.fw-edge.sel .ln { stroke-width: 3; }
.fw-sign { font: 600 14px var(--sans); }
.panel { background: var(--leaf); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin-top: 10px; display: grid; gap: 10px; font-size: 14px; }
.panel h3 { margin: 0; font: 500 17px/1.3 var(--serif); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--faint); margin-top: 8px; }
.legend i { display: inline-block; width: 22px; border-top: 2px solid var(--ink); vertical-align: middle; margin-right: 5px; }
.legend i.d { border-top-style: dashed; border-color: var(--faint); } .legend i.c { border-color: var(--bad); } .legend i.p { border-top-style: dotted; border-color: var(--accent); }
.fw-handle { fill: var(--leaf); stroke: var(--accent); stroke-width: 1.5; cursor: crosshair; opacity: .55; }
.fw-node:hover .fw-handle, .fw-node.sel .fw-handle { opacity: 1; }
.fw-link { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 4; pointer-events: none; }
.fw-tag { font: 600 12px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--leaf); stroke-width: 4px; }
.fw-edge.added .ln { stroke: var(--good); stroke-width: 2.4; } .fw-edge.removed .ln { stroke: var(--bad); stroke-dasharray: 6 5; opacity: .7; } .fw-edge.changed .ln { stroke: var(--warn); stroke-width: 2.4; }

  // ---------- commands and usage ----------
  const kTok = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n || 0);
  const CMDS = [
    ["/paperscout:start", "Turn on research mode for this task, connect the project and get the Desk link."],
    ["/paperscout:desk", "Reopen the Desk in the browser pane; add \"browser\" to open it in your own browser, where it stays between chats."],
    ["/paperscout:ask <question>", "A quick answer from the literature: verdict, positions, debate and a reading list, saved to the map."],
    ["/paperscout:lit <topic>", "A literature review of a topic, lab or author, with citations and provenance."],
    ["/paperscout:deepresearch <question>", "A thorough, cited brief; you approve the plan first."],
    ["/paperscout:review <draft or paper>", "A tough internal critique with severity-graded objections."],
    ["/paperscout:compare <sources>", "A matrix of where sources agree and disagree."],
    ["/paperscout:summarize <paper>", "One source digested section by section."],
    ["/paperscout:draft <topic>", "A paper-style draft built on the map's idea, claims and evidence."],
    ["/paperscout:audit <paper + repo>", "Does the code match the paper's claims?"],
    ["/paperscout:replicate <paper>", "A replication plan, and optionally a run."],
    ["/paperscout:recipe <task>", "Ranked, result-backed training or evaluation recipes."],
    ["/paperscout:autoresearch <idea>", "A bounded experiment loop against a benchmark."],
    ["/paperscout:eli5 <paper or idea>", "A plain-language explanation."],
    ["/paperscout:log", "A session log before stopping."],
    ["/paperscout:end", "Leave research mode."],
  ];
  const SAYS = ["Add this as a concept", "Record this as the new version of the idea", "What supports K2?", "Propose a framework from the current claims", "Save the papers my argument rests on", "Fetch the saved papers into the folder", "Turn my supervisor's comments into tasks"];
  function openSheet(focus) { S.sheet = focus || "commands"; renderSheet(); }
  function closeSheet() { S.sheet = null; renderSheet(); $("#help").focus(); }
  function renderSheet() {
    const host = $("#sheet");
    if (!S.sheet) { host.replaceChildren(); return; }
    const u = S.data?.usage;
    const copy = (t) => { const c = t.split(" <")[0]; try { navigator.clipboard.writeText(c); banner(`Copied ${c}`); } catch {} };
    const rows = (o) => Object.entries(o?.byTool || {}).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => el("div", { class: "use-row" }, el("span", {}, k === "(tool definitions)" ? "Tool definitions (once per conversation)" : k), el("b", {}, "≈" + kTok(v))));
    const sheet = el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Commands and usage" },
      el("h2", {}, "Commands", el("button", { class: "icon", type: "button", "aria-label": "Close", onclick: closeSheet }, "✕")),
      el("p", { class: "missing" }, "Type these in a Cowork task, or copy one from here."),
      el("div", { class: "cmds" }, ...CMDS.map(([c, d]) => el("div", { class: "cmd" }, el("code", {}, c), el("button", { class: "linkbtn copy", type: "button", onclick: () => copy(c) }, "Copy"), el("p", {}, d)))),
      el("h3", {}, "Or just say"),
      el("ul", { class: "says" }, ...SAYS.map((x) => el("li", {}, `"${x}"`))),
      el("h3", { id: "usage-h" }, "Claude usage"),
      u ? el("div", { class: "use-big" }, el("div", {}, el("b", {}, "≈" + kTok(u.today.tokens)), el("span", {}, `today, ${plural(u.today.calls || 0, "call")}`)), el("div", {}, el("b", {}, "≈" + kTok(u.week)), el("span", {}, "last 7 days")), el("div", {}, el("b", {}, "≈" + kTok(u.project.tokens)), el("span", {}, "this project"))) : el("p", { class: "missing" }, "No usage recorded yet."),
      u && Object.keys(u.today.byTool || {}).length ? el("div", {}, ...rows(u.today)) : null,
      el("p", { class: "hint" }, "What Paper Scout added to Claude's context: tool results and the tool definitions, estimated at four characters a token. Claude's own reading, thinking and writing come on top. Anything you do on this page costs nothing."));
    const back = el("div", { class: "sheet-back", onclick: (e) => { if (e.target === back) closeSheet(); } }, sheet);
    host.replaceChildren(back);
    setTimeout(() => { if (S.sheet === "usage") $("#usage-h")?.scrollIntoView({ block: "start" }); else sheet.querySelector("button")?.focus(); }, 0);
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) closeSheet(); });
  $("#help").addEventListener("click", () => openSheet("commands"));
  // The Desk in the user's own browser: it stays open between chats and when Claude's browser pane is closed.
  $("#popout").addEventListener("click", () => {
    fetch(`/api/open-url?t=${TOKEN}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url: location.origin + "/?t=" + TOKEN }) })
      .then((r) => { if (!r.ok) throw new Error(); banner("Opened in your browser. Bookmark it: the Desk is there whenever Claude is running."); setTimeout(() => banner(null), 5000); })
      .catch(() => window.open(location.href, "_blank", "noopener"));
  });

  // Every link that leaves the Desk (papers, Semantic Scholar, the library, GitHub, the summary, PDFs) opens in
  // your default browser, so the pane showing the Desk never navigates away from it.
  document.addEventListener("click", (e) => {
    const a = e.target.closest?.("a[href]"); if (!a || e.defaultPrevented) return;
    const href = a.getAttribute("href"); if (!href || href === "#" || href.startsWith("#")) return;
    const url = new URL(href, location.href);
    if (url.origin === location.origin && !a.target && !/^\/(summary|pdf)/.test(url.pathname)) return;
    e.preventDefault();
    fetch(`/api/open-url?t=${TOKEN}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url: url.href }) })
      .then((r) => { if (!r.ok) throw new Error(); banner("Opened in your browser."); setTimeout(() => banner(null), 2500); })
      .catch(() => window.open(url.href, "_blank", "noopener"));
  });

  // ---------- global actions ----------
  async function switchTo(name) { try { await call("session", { action: "start", name }); S.pendingSwitch = null; S.pinned = false; S.viewing = slug(name); await load(); } catch (e) { banner(errText(e), true); } }
  $("#project").addEventListener("change", (e) => { S.viewing = e.target.value; S.pinned = e.target.value !== slug(S.data?.activeName); S.pendingSwitch = null; S.fw = { sel: null, pending: null, view: null, compare: null, adding: null, renaming: false, creating: false, linking: false }; load(); });
  $("#refresh").addEventListener("click", () => load());
  $("#live").addEventListener("click", () => { S.live = !S.live; $("#live").classList.toggle("on", S.live); $("#live").setAttribute("aria-pressed", String(S.live)); schedule(); if (S.live) load({ quiet: true }); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.live) load({ quiet: true }); });
  // Size the logo to the capital height of the wordmark as actually rendered, so the page mark
  // spans exactly from the baseline to the top of the P, whatever font loads.
  function fitLogo() {
    try {
      const w = document.getElementById("wordmark"), cs = getComputedStyle(w);
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const capH = ctx.measureText("P").actualBoundingBoxAscent;
      if (capH > 4) document.querySelector(".brand").style.setProperty("--cap", capH + "px");
    } catch {}
  }
  fitLogo(); if (document.fonts?.ready) document.fonts.ready.then(fitLogo);
  window.addEventListener("resize", fitLogo);
  load().then(schedule);
})();
</script>
</body></html>
